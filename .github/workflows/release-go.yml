name: Release Go client

on:
  push:
    tags:
      - "logmate-client-go/v*"

permissions:
  contents: write

defaults:
  run:
    working-directory: logmate-client-go

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: logmate-client-go/go.sum
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version=$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' src/logmate/types.go)
          case "$RELEASE_TAG" in
            "logmate-client-go/v$package_version"|"logmate-client-go/v$package_version"-*) ;;
            *) echo "Tag $RELEASE_TAG does not match Version $package_version"; exit 1 ;;
          esac
      - run: CGO_ENABLED=0 go test ./...
      - run: go vet ./...
      - name: Create GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          module_version=${GITHUB_REF_NAME#logmate-client-go/}
          if [[ "$module_version" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" --prerelease --generate-notes --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
